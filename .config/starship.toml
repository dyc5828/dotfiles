# Use custom format
format = '$all'

# Change the default prompt characters
[character]
success_symbol = ""
error_symbol = ""

# Shows the username
[username]
format = "[󰀓 $user]($style) "
style_user = "bold green"
style_root = "bold red"
disabled = false
show_always = true

[directory]
truncation_length = 2
truncation_symbol = " "
home_symbol = " ~"
read_only = ""
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "󰘬 "
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
tag_disabled = false
tag_symbol = " 󰓼 "

[nodejs]
format = "[$symbol($version)]($style) "

[package]
disabled = false
symbol = " "
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 10_000
style = "bold #FFA500"
format = "[󰔚 $duration]($style) "

[aws]
disabled = true

[custom.aws_sso]
description = "AWS profile(s) with a valid SSO session"
symbol = "󰸏 "
format = '\[[$symbol$output]($style)\] '
command = "$HOME/.config/starship-aws-sso.sh"
when = "$HOME/.config/starship-aws-sso.sh"
shell = ["bash", "--noprofile", "--norc"]

[gcloud]
symbol = "󱇶 "
format = '\[[$symbol$project(:$region)]($style)\] '
[gcloud.project_aliases]
gen-lang-client-0281451474 = "Dans GCP"
